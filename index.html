<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fat-Loss">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Week 1 Fat-Loss Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f4f5f7;--card:#ffffff;--card2:#eef0f3;--text:#0e1116;--muted:#525c67;--line:#dde1e6;
  --accent:#087f5b;--accent-ink:#ffffff;--accent-soft:rgba(8,127,91,.12);--danger:#b42318;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0a0c0f;--card:#14171c;--card2:#1d2128;--text:#eef1f4;--muted:#a0a9b3;--line:#2a2f37;
    --accent:#3ddc97;--accent-ink:#04170f;--accent-soft:rgba(61,220,151,.14);--danger:#ff7b6e;
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#0a0c0f;--card:#14171c;--card2:#1d2128;--text:#eef1f4;--muted:#a0a9b3;--line:#2a2f37;
  --accent:#3ddc97;--accent-ink:#04170f;--accent-soft:rgba(61,220,151,.14);--danger:#ff7b6e;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
.top-in{max-width:560px;margin:0 auto}
.top-row{display:flex;align-items:center;gap:8px}
.top h1{flex:1;min-width:0;margin:0;font-size:17px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebar{display:flex;align-items:center;gap:4px;margin-top:2px}
.date-label{flex:1;min-width:0;min-height:44px;border:0;background:none;padding:0 4px;text-align:center;display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.date-label b{font-size:16px}
.date-label span{font-size:13px;color:var(--muted)}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--text)}
.icon-btn:disabled{opacity:.35;cursor:default}

/* Layout */
main{max-width:560px;margin:0 auto;padding:12px 16px calc(92px + env(safe-area-inset-bottom))}
body.timer-on main{padding-bottom:calc(172px + env(safe-area-inset-bottom))}
.view{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h2.sec{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:18px;line-height:1.25}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.neutral{background:var(--card2);color:var(--muted)}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px;margin:10px 0 0}
.note b{color:var(--accent)}
.plain-list{margin:6px 0 0;padding-left:20px}
.plain-list li{margin:6px 0}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* Buttons & inputs */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn:active,.icon-btn:active{transform:scale(.97)}
.field{width:100%;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:17px;padding:0 12px;-webkit-appearance:none;appearance:none}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px}
.field::placeholder{color:var(--muted);opacity:.75}
textarea.field{height:auto;padding:12px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.form.dated{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) auto}
.form input[type=date]{padding:0 8px;font-size:16px}
.form label{display:block;min-width:0}
.form label span{display:block;font-size:13px;color:var(--muted);margin:0 0 4px 2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card2);border-radius:12px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:650;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line)}

/* Checkboxes */
.check{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;cursor:pointer;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{position:absolute;opacity:0;width:1px;height:1px;left:0;top:50%;margin:0}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.box svg{width:18px;height:18px;stroke:var(--accent-ink);stroke-width:3;opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s}
.check input:checked + .box{background:var(--accent);border-color:var(--accent)}
.check input:checked + .box svg{opacity:1;transform:none}
.check input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.check .txt{flex:1;min-width:0}
.check .txt small{display:block;color:var(--muted);font-size:13px}
.check.plain{border-top:0}

/* Today */
.hero{display:flex;gap:16px;align-items:center}
.ring{width:104px;height:104px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--card2);fill:none;stroke-width:10}
.ring .bar{stroke:var(--accent);fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .lbl b{font-size:24px}
.ring .lbl span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.week button{min-height:56px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.week button .dot{width:8px;height:8px;border-radius:50%;border:2px solid currentColor}
.week button .dot.gym{background:currentColor}
.week button .dot.rest{border-style:dotted}
.week button.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.week button.full{color:var(--text)}
.week button:disabled{opacity:.5;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .dot{width:8px;height:8px;border-radius:50%;border:2px solid currentColor}
.legend .dot.gym{background:currentColor}
.legend .dot.rest{border-style:dotted}
.counter{display:flex;align-items:center;gap:12px;margin-top:10px}
.counter .val{flex:1;text-align:center;line-height:1.1}
.counter .val b{font-size:32px;letter-spacing:-.02em}
.counter .icon-btn{width:56px;height:56px;border-radius:16px;background:var(--card2)}
.counter .icon-btn.add{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.glasses{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:12px}
.glasses i{height:10px;border-radius:3px;background:var(--card2)}
.glasses i.on{background:var(--accent)}
.glasses i.goal{box-shadow:inset 0 -2px 0 var(--muted)}
.meter{position:relative;height:10px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:10px}
.meter span{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px;transition:width .3s ease}
.meter .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--muted);opacity:.6}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:6px}

/* Workout */
.ex-head{display:flex;gap:12px;align-items:flex-start}
.num{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.cue{display:flex;gap:8px;margin-top:10px;font-size:15px}
.cue svg{color:var(--accent);margin-top:1px}
.last{margin-top:10px;font-size:14px;color:var(--muted);background:var(--card2);border-radius:10px;padding:8px 12px}
.last b{color:var(--text)}
.sets{margin-top:10px}
.setrow{display:grid;grid-template-columns:100px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:4px 0}
.setrow .check{border:0;min-height:48px;padding:0}
.setrow .check .txt{font-weight:650;line-height:1.15}
.setrow.opt{opacity:.55}
.setrow.done .field{border-color:var(--accent)}
.inp{position:relative;display:block;min-width:0}
.inp .field{padding-right:42px}
.inp span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.na{font-size:13px;color:var(--muted);text-align:center}
.ex-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ex-foot .check{flex:1;min-width:180px;border:0}
.yt{color:var(--text)}

/* Meals */
.meal .txt b{display:block}
.meal .time{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.02em}
.meal .macro{text-align:right;font-size:13px;color:var(--muted);flex:none;line-height:1.3}
.meal .macro b{display:block;color:var(--text);font-size:15px}
.extra-list{margin-top:8px}
.extra-list .row{border-top:1px solid var(--line);min-height:48px}
details.card{padding:0}
details.card summary{list-style:none;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:700;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
details.card[open] summary .chev{transform:rotate(90deg)}
details.card .body{padding:0 16px 16px}
.swap{border-top:1px solid var(--line);padding:10px 0}
.swap:first-child{border-top:0;padding-top:0}
.swap b{display:block}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:650}
.stat b{font-size:20px;letter-spacing:-.01em}
.chart{width:100%;height:auto;display:block;margin-top:12px}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .t{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .tg{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.chart .ln{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent-soft)}
.chart .dt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.chart .tl{fill:var(--accent);font-size:12px;font-weight:700}
.chart-empty{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}
table.wk{width:100%;border-collapse:collapse;font-size:15px;margin-top:4px}
table.wk th{font-size:12px;color:var(--muted);text-align:left;font-weight:650;padding:6px 4px}
table.wk td{border-top:1px solid var(--line);padding:10px 4px}
table.wk td:not(:first-child),table.wk th:not(:first-child){text-align:right}
.rule{display:flex;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-top:8px;font-size:15px}
.rule.hit{border-color:var(--accent);background:var(--accent-soft)}
.rule .tag{font-weight:800;min-width:0}
.hist .row{min-height:48px;border-top:1px solid var(--line)}
.hist .row:first-child{border-top:0}

/* Coach */
.cnote{padding:12px 0 12px 14px;border-top:1px solid var(--line);position:relative}
.cnote:first-child{border-top:0;padding-top:0}
.cnote::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--accent)}
.cnote:first-child::before{top:2px}
.cnote b{display:block;font-size:15px}
.cnote span{display:block;font-size:14.5px;color:var(--muted);margin-top:2px}

/* Bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs button{min-height:62px;background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.tabs button[aria-selected=true]{color:var(--accent)}
.tabs button[aria-selected=true]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* Rest timer */
.timer{position:fixed;z-index:29;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:10px 10px 14px 16px;display:flex;align-items:center;gap:8px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.18);animation:fade .18s ease-out}
.timer[hidden]{display:none}
.timer .tm{flex:1;min-width:0;line-height:1.1}
.timer .tm span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.timer .tm b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.timer .tb{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--card2)}
.timer .tb span{display:block;height:100%;background:var(--accent);width:100%}
.timer.over{background:var(--accent);color:var(--accent-ink)}
.timer.over .tm span{color:inherit}

/* Modal & toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:20px}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;animation:fade .18s ease-out}
.toast[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="top-row">
      <h1>Week 1 Fat-Loss Tracker</h1>
      <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="Change theme"></button>
    </div>
    <div class="datebar">
      <button class="icon-btn" data-act="prevDay" aria-label="Previous day" id="prevBtn"></button>
      <button class="date-label" data-act="goToday" id="dateLabel" aria-label="Go to today"></button>
      <button class="icon-btn" data-act="nextDay" aria-label="Next day" id="nextBtn"></button>
    </div>
  </div>
</header>

<main id="main"></main>

<div id="timer" class="timer" hidden role="timer">
  <div class="tm"><span id="tLabel">Rest</span><b id="tTime">1:30</b></div>
  <button class="btn sm" data-act="tPlus">+15 s</button>
  <button class="btn sm ghost" data-act="tSkip" id="tSkip">Skip</button>
  <div class="tb"><span id="tBar"></span></div>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in" role="tablist" id="tabs"></div>
</nav>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
'use strict';

/* ---------- Icons (inline SVG) ---------- */
const svg = (p, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I = {
  today: svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>'),
  workout: svg('<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>'),
  meals: svg('<path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M8 7.5c0-1.5 1.2-2 1.2-3.5M12 7.5c0-1.5 1.2-2 1.2-3.5M16 7.5c0-1.5 1.2-2 1.2-3.5"/>'),
  progress: svg('<path d="M4 4v16h16"/><path d="m7.5 14.5 3.5-4 3 2.5 5-6.5"/>'),
  coach: svg('<circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5a7 7 0 0 1 14 0"/><path d="m15.5 14.5 1.5 2 3-3.5"/>'),
  sunny: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>'),
  heart: svg('<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/>'),
  pill: svg('<rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="m9.2 8 5.6 8"/>'),
  target: svg('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/>'),
  check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
  left: svg('<path d="m14.5 6-6 6 6 6"/>'),
  right: svg('<path d="m9.5 6 6 6-6 6"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  minus: svg('<path d="M5 12h14"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>'),

  const t = S.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const btn = $('#themeBtn');
  btn.innerHTML = t === 'dark' ? I.moon : t === 'light' ? I.sun : I.auto;
  btn.setAttribute('aria-label', `Theme: ${t}. Tap to change`);
  requestAnimationFrame(() => {
    const bg = getComputedStyle(document.body).backgroundColor;
    document.querySelector('meta[name=theme-color]').setAttribute('content', bg);
  });
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

  const t = todayKey(), isToday = view === t;

}

function render() {
  renderChrome();
  const tab = S.settings.tab;

/* ---------- TODAY ---------- */
const RING_C = 2 * Math.PI * 44;
function ringState(k) {
  const d = day(k), list = checksFor(k);
  const done = list.filter(c => d.c[c[0]]).length;
  return { done, total: list.length };
}

function refreshTodayLive() {
  if (S.settings.tab !== 'today') return;
  const { done, total } = ringState(view);
  const bar = $('#ringBar'); if (bar) bar.setAttribute('stroke-dashoffset', RING_C * (1 - done / total));

function describeSets(ex, r) {
  const done = r.s.filter(s => s.d);
  if (ex.noWeight) return done.map(s => s.r ? `${s.r}${ex.unit === 'sec' ? ' s' : ' reps'}` : '✓').join(', ');
  const kg = ex.perDb ? 'kg each' : 'kg';
  const ws = [...new Set(done.map(s => s.w).filter(Boolean))];
  if (ws.length === 1) return `${ws[0]} ${kg} × ${done.map(s => s.r || '?').join(', ')}`;
  return done.map(s => `${s.w || '?'} ${kg} × ${s.r || '?'}`).join(', ');
}
function exCard(ex, i, first) {

    const rIn = `<label class="inp"><input class="field" type="number" inputmode="numeric" min="0" data-setr="${ex.id}:${j}" value="${esc(s.r)}" placeholder="${ex.reps.split(' ')[0]}" aria-label="${esc(ex.name)} set ${j + 1} ${ex.unit}"><span>${ex.unit}</span></label>`;
    return `<div class="setrow ${s.d ? 'done' : ''} ${opt ? 'opt' : ''}">

/* ---------- PROGRESS ---------- */
function chart(pts, { target = null, unit = '' } = {}) {
  if (pts.length < 2) return `<div class="chart-empty">${pts.length ? 'Add one more entry to see the chart.' : 'No entries yet.'}</div>`;
  const W = 340, H = 190, L = 34, R = 14, T = 16, B = 24;
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (target != null) { lo = Math.min(lo, target); hi = Math.max(hi, target); }
  const pd = Math.max(0.5, (hi - lo) * 0.08);
  lo = Math.floor(lo - pd); hi = Math.ceil(hi + pd);
  const d0 = pts[0].d, span = Math.max(1, diffDays(d0, pts[pts.length - 1].d));
  const x = k => L + (W - L - R) * diffDays(d0, k) / span;
  const y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, yy = y(v).toFixed(1);
    g += `<line class="g" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="t" x="${L - 6}" y="${(+yy + 4).toFixed(1)}" text-anchor="end">${(hi - lo) <= 4 ? v.toFixed(1) : Math.round(v)}</text>`;
  }
  if (target != null) {
    const ty = y(target).toFixed(1);
    g += `<line class="tg" x1="${L}" x2="${W - R}" y1="${ty}" y2="${ty}"/><text class="t" x="${W - R}" y="${(+ty - 5).toFixed(1)}" text-anchor="end">Goal ${target} ${unit}</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = `${line}L${x(pts[pts.length - 1].d).toFixed(1)},${H - B}L${L},${H - B}Z`;
  const dots = pts.length <= 45 ? pts.map(p => `<circle class="dt" cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5"/>`).join('') : '';
  const lp = pts[pts.length - 1];
  const lx = x(lp.d), ly = y(lp.v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart from ${fmtDM(d0)} to ${fmtDM(lp.d)}, latest ${lp.v} ${unit}">
    ${g}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>${dots}
    <text class="tl" x="${Math.min(lx, W - R)}" y="${Math.max(12, ly - 9)}" text-anchor="end">${lp.v}</text>
    <text class="t" x="${L}" y="${H - 6}">${fmtDM(d0)}</text><text class="t" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDM(lp.d)}</text>
  </svg>`;
}
const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
function weeklyAverages() {
  const ws = sortedBy(S.weights);
  if (!ws.length) return [];
  const base = ws[0].d < S.start ? ws[0].d : S.start;
  const map = new Map();
  ws.forEach(w => { const i = Math.floor(diffDays(base, w.d) / 7); if (!map.has(i)) map.set(i, []); map.get(i).push(w.kg); });
  return [...map.entries()].sort((a, b) => a[0] - b[0]).map(([i, v]) => ({ i, from: addDays(base, i * 7), to: addDays(base, i * 7 + 6), avg: avg(v), n: v.length }));
}
function review() {
  const t = todayKey();
  const unlock = addDays(S.start, 7);
  if (t < unlock) return { locked: true, unlock };
  const wk = weeklyAverages(), ws = sortedBy(S.weights);
  if (!ws.length) return { locked: false, loss: null, basis: 'Log your morning weights to get a verdict.' };
  let loss, basis;
  if (wk.length >= 2) {
    const a = wk[wk.length - 2], b = wk[wk.length - 1];
    loss = a.avg - b.avg;
    basis = `Week ${a.i + 1} average ${a.avg.toFixed(1)} kg → week ${b.i + 1} average ${b.avg.toFixed(1)} kg`;
  } else {
    loss = ws[0].kg - wk[0].avg;
    basis = `First weigh-in ${ws[0].kg.toFixed(1)} kg → this week's average ${wk[0].avg.toFixed(1)} kg`;
  }
  const v = loss < 0.3 ? 'cut' : loss < 0.5 ? 'close' : loss <= 1.2 ? 'keep' : 'add';
  return { locked: false, loss, basis, v };
}

function dayHasData(d) {

    Object.values(d.h || {}).some(Boolean) ||
    (d.extra && d.extra.length) || Object.values(d.x || {}).some(Boolean) ||

}
function exportText() {

  L.push('');
  L.push('WAIST (cm, at belly button)');
  if (!wa.length) L.push('  none');
  wa.forEach(w => L.push(`  ${w.d}  ${w.cm}`));
  L.push('');
  L.push('CHEST (cm, at nipple level)');
  const ch = sortedBy(S.chests);
  if (!ch.length) L.push('  none');

/* ---------- Rest timer ---------- */
const T = { end: 0, dur: 0, iv: null, ctx: null, hideT: null };
function unlockAudio() {
  try {
    T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (T.ctx.state === 'suspended') T.ctx.resume();
  } catch (e) { /* audio is optional */ }
}
function beep() {
  if (!T.ctx) return;
  try {
    const t0 = T.ctx.currentTime;
    [0, 0.25].forEach(off => {
      const o = T.ctx.createOscillator(), g = T.ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(T.ctx.destination);
      g.gain.setValueAtTime(0.0001, t0 + off);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.2);
      o.start(t0 + off); o.stop(t0 + off + 0.22);
    });
  } catch (e) { /* audio is optional */ }
}
const mmss = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
function startTimer() {
  unlockAudio();
  clearTimeout(T.hideT);
  T.dur = S.settings.rest * 1000; T.end = Date.now() + T.dur;
  const el = $('#timer'); el.hidden = false; el.classList.remove('over');
  $('#tLabel').textContent = 'Rest'; $('#tSkip').textContent = 'Skip';
  document.body.classList.add('timer-on');
  if (!T.iv) T.iv = setInterval(tickTimer, 250);
  tickTimer();
}
function tickTimer() {
  const left = T.end - Date.now();
  if (left <= 0) { finishTimer(); return; }
  $('#tTime').textContent = mmss(left);
  $('#tBar').style.width = `${left / T.dur * 100}%`;
}
function finishTimer() {
  clearInterval(T.iv); T.iv = null;
  const el = $('#timer'); el.classList.add('over');
  $('#tLabel').textContent = 'Rest over'; $('#tTime').textContent = 'Next set';
  $('#tBar').style.width = '0%'; $('#tSkip').textContent = 'Close';
  beep();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  T.hideT = setTimeout(hideTimer, 6000);
}
function hideTimer() {
  clearInterval(T.iv); T.iv = null; clearTimeout(T.hideT);
  $('#timer').hidden = true; document.body.classList.remove('timer-on');
}

function upsert(arr, d, obj) {

  if (i >= 0) arr[i] = obj; else arr.push(obj);
}

  jump(el) { view = el.dataset.d; render(); },
  goTab(el) { S.settings.tab = el.dataset.tab; save(); render(); scrollTo(0, 0); },
  waterPlus() { const d = day(); d.water = Math.min(6000, d.water + 250); if (d.water >= 2500) d.c.water = true; save(); render(); },
  waterMinus() { const d = day(); d.water = Math.max(0, d.water - 250); save(); render(); },
  restLen(el) { S.settings.rest = +el.dataset.v; save(); document.querySelectorAll('[data-act=restLen]').forEach(b => b.setAttribute('aria-pressed', b === el)); },
  addExtra() {
    const name = $('#exName').value.trim(), kcal = Math.max(0, Math.round(+$('#exKcal').value || 0)), p = Math.max(0, Math.round(+$('#exP').value || 0));
    if (!kcal && !p) { toast('Enter calories or protein'); return; }
    day().extra.push({ name, kcal, p }); save(); render();
  },
  delExtra(el) { day().extra.splice(+el.dataset.i, 1); save(); render(); },
  addWeight() {
    const d = $('#wDate').value, kg = parseFloat($('#wKg').value);
    if (!d || d > todayKey()) { toast('Pick a valid date'); return; }
    if (!(kg >= 30 && kg <= 300)) { toast('Enter a weight between 30 and 300 kg'); return; }
    upsert(S.weights, d, { d, kg: r1(kg) });
    day(d).c.weigh = true;
    save(); render(); toast(`Saved ${r1(kg).toFixed(1)} kg for ${fmtShort(d)}`);
  },
  delWeight(el) { S.weights = S.weights.filter(w => w.d !== el.dataset.d); save(); render(); },
  addMeas(el) {
    const m = el.dataset.m, cfg = MEAS[m];
    const d = $(`#m-${m}-date`).value, cm = parseFloat($(`#m-${m}-cm`).value);
    if (!d || d > todayKey()) { toast('Pick a valid date'); return; }
    if (!(cm >= 40 && cm <= 200)) { toast(`Enter a ${cfg.label.toLowerCase()} between 40 and 200 cm`); return; }
    upsert(S[cfg.arr], d, { d, cm: Math.round(cm * 2) / 2 });
    save(); render(); toast(`Saved ${cfg.label.toLowerCase()} ${cm} cm for ${fmtShort(d)}`);
  },
  delMeas(el) { const a = MEAS[el.dataset.m].arr; S[a] = S[a].filter(w => w.d !== el.dataset.d); save(); render(); },
  setWt(el) { day().wt = el.dataset.v; save(); render(); },
  applyAdj(el) {
    const delta = +el.dataset.v;
    S.profile.adj = (S.profile.adj || 0) + delta;
    S.profile.adjLog.push({ d: todayKey(), week: weekIdx(), delta });
    save(); render(); toast(`Targets ${delta > 0 ? 'raised' : 'lowered'} by 150 kcal`);
  },
  undoAdj() {
    const last = S.profile.adjLog.pop();
    S.profile.adj = last ? S.profile.adj - last.delta : 0;
    save(); render(); toast('Adjustment undone');
  },
  saveProfile() {
    const dob = $('#pDob').value, h = +$('#pH').value, st = parseFloat($('#pStart').value), g = parseFloat($('#pGoal').value);
    if (!dob || dob > todayKey()) { toast('Pick a valid birthday'); return; }
    if (!(h >= 140 && h <= 220)) { toast('Height should be 140–220 cm'); return; }
    if (!(st >= 40 && st <= 250) || !(g >= 40 && g <= 250)) { toast('Weights should be 40–250 kg'); return; }
    if (g >= st) { toast('Goal should be below your starting weight'); return; }
    Object.assign(S.profile, { dob, heightCm: h, startKg: r1(st), goalKg: Math.round(g * 2) / 2 });
    save(); render(); toast('Profile saved. Targets updated.');
  },
  export() {
    openModal(`<h3>Export data</h3>
      <p class="small muted" style="margin:0 0 10px">A readable summary followed by a full JSON backup.</p>
      <textarea class="field" id="exportTxt" rows="12" readonly>${esc(exportText())}</textarea>
      <div class="acts"><button class="btn primary" data-act="copyExport">${I.copy}Copy</button><button class="btn" data-act="dlExport">${I.download}Download</button></div>
      <button class="btn ghost block" style="margin-top:8px" data-act="closeModal">Close</button>`);
  },
  async copyExport() {
    const ta = $('#exportTxt');
    try { await navigator.clipboard.writeText(ta.value); toast('Copied'); }
    catch (e) { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (_) { toast('Select the text and copy it manually'); } }
  },
  dlExport() {
    const blob = new Blob([$('#exportTxt').value], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `fat-loss-tracker-${todayKey()}.txt`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  reset() {
    openModal(`<h3>Delete all data?</h3>
      <p class="small muted" style="margin:0">This removes every weight, waist, chest, meal, workout and checklist entry from this phone, and any calorie adjustments. Your profile is kept. It cannot be undone. Export first if you want a backup.</p>
      <div class="acts"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" style="background:var(--danger);color:#fff" data-act="confirmReset">Delete all</button></div>`);
  },
  confirmReset() {
    const theme = S.settings.theme, profile = { ...S.profile, adj: 0, adjLog: [] };
    S = fresh(); S.settings.theme = theme; S.settings.tab = 'today'; S.profile = profile;
    save(); hideTimer(); closeModal(); view = todayKey(); render(); scrollTo(0, 0); toast('All data deleted');
  },
  closeModal,
  tPlus() { if (T.iv) { T.end += 15000; T.dur += 15000; tickTimer(); } else startTimer(); },
  tSkip: hideTimer
};

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn && !tabBtn.dataset.act) {
    if (S.settings.tab !== tabBtn.dataset.tab) { S.settings.tab = tabBtn.dataset.tab; save(); render(); scrollTo(0, 0); }
    return;
  }
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) { actions[el.dataset.act](el); return; }
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

document.addEventListener('change', e => {
  const t = e.target, ds = t.dataset;
  if (ds.check) {
    day().c[ds.check] = t.checked; save();
    if (S.settings.tab === 'today') refreshTodayLive(); else render();
  } else if (ds.set) {
    const [id, j] = ds.set.split(':'), ex = exById(id);
    const before = setCounts(view);
    exRec(view, ex).s[+j].d = t.checked;
    t.closest('.setrow').classList.toggle('done', t.checked);
    const after = setCounts(view);
    if (after.done === after.total && before.done < before.total && planFor(view).type === 'gym') {
      day().c.activity = true; toast(`Workout ${workoutLetter(view)} complete. Finish with the incline walk.`);
    }
    save(); refreshWorkoutProgress();
    if (t.checked && view === todayKey()) startTimer();
  } else if (ds.easy) {
    exRec(view, exById(ds.easy)).easy = t.checked; save();
  } else if (ds.habit) {
    day().h[ds.habit] = t.checked; save();
    const n = HABITS.filter(h => day().h[h[0]]).length;
    const hd = [...document.querySelectorAll('h2.sec')].find(x => x.textContent.startsWith('Hormone habits'));
    if (hd) hd.textContent = `Hormone habits · ${n}/${HABITS.length}`;
  } else if (ds.x) {
    day().x[ds.x] = t.checked; save();
  } else if (ds.meal) {
    day().meals[ds.meal] = t.checked; save(); render();
  }
});

document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset;
  if (ds.setw || ds.setr) {
    const [id, j] = (ds.setw || ds.setr).split(':'), ex = exById(id);
    exRec(view, ex).s[+j][ds.setw ? 'w' : 'r'] = t.value.slice(0, 6);
    save();
  } else if ('steps' in ds) {
    const d = day(), v = t.value.slice(0, 6), n = +v || 0;
    d.steps = v;
    if (n >= 8000) d.c.steps = true;
    save();
    const bar = $('#stepsBar'); if (bar) bar.style.width = `${Math.min(100, n / 100)}%`;
    const txt = $('#stepsTxt'); if (txt) txt.textContent = n >= 8000 ? 'Step goal hit' : `${num(Math.max(0, 8000 - n))} to 8,000`;
    refreshTodayLive();
  }
});

/* Roll over to the new plan day if the app stays open across noon. */
function checkRollover() {
  const t = todayKey();
  if (t !== lastToday) { if (view === lastToday) view = t; lastToday = t; render(); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  checkRollover();
  if (T.iv) tickTimer();
});
setInterval(checkRollover, 60000);

/* ---------- Installable app ---------- */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  if (S.settings.tab === 'progress') render();
});
window.addEventListener('appinstalled', () => { installPrompt = null; render(); toast('Installed. Open it from your home screen.'); });
actions.install = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null; render();
};
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

applyTheme();
save();
render();
})();
</script>
</body>
</html>
